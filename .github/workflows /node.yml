name: Cortex Runtime Lifecycle

on:
  push:
    branches: [main, master]
  repository_dispatch:
    types: [WAKE_UP_CORTEX, SYNAPSE_PULSE]
  workflow_dispatch:
  schedule:
    - cron: "30 */4 * * *"

permissions:
  contents: write

concurrency:
  group: cortex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-cortex-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python syntax
        run: python -m py_compile kernel.py

      - name: Run Cortex kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          CORTEX_HTTP_TIMEOUT: "8"
        run: python kernel.py

      - name: Validate runtime artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("synapses/state.json"),
              Path("synapses/cortex_weights.json"),
              Path("synapses/cortex_ledger.json"),
              Path("README.md"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing artifacts: {missing}")

          for path in required[:3]:
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)

          state = json.loads(
              Path("synapses/state.json").read_text(encoding="utf-8")
          )
          if state.get("status") != "completed_with_observed_inputs":
              raise SystemExit("Kernel did not report completed observed inputs")
          if int(state.get("input_count", 0)) < 1:
              raise SystemExit("Kernel had no observed input")
          print("Runtime artifacts validated.")
          PY

      - name: Persist runtime evidence
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "Cortex-Transceiver-Bot"
          git config user.email "bot@cortex.mesh"

          git add README.md synapses/state.json \
            synapses/cortex_weights.json synapses/cortex_ledger.json

          if git diff --cached --quiet; then
            echo "No runtime artifact changes to commit."
            exit 0
          fi

          git commit -m "Cortex: persist runtime evidence [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
